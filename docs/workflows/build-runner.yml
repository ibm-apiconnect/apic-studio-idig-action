#---------------------------------------------------------------------------
# Build and push the self-hosted GitHub Actions runner image to GHCR.
#
# Run this once (or whenever .github/runner/Containerfile changes) before
# deploying the runner to a vanilla Kubernetes cluster.
#
# The image is pushed to:
#   ghcr.io/<org-or-user>/github-runner:latest
#
# No secrets need to be configured — GITHUB_TOKEN is used automatically.
#---------------------------------------------------------------------------

name: Build runner image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - .github/runner/Containerfile

jobs:
  build:
    name: Build and push runner image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/runner
          file: .github/runner/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/github-runner:latest
